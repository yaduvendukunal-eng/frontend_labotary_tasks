<!DOCTYPE html>
<html>

<head>

    <title>Task of html</title>

</head>

<body>
<script>
    let x=prompt("Enter the a Number or String");
    if(x==""){
        console.log("Please Enter the proper Input");
    }
    else if (isNaN(x)){
        console.log("String");
    }
    else {
        console.log("Number");
    }

</script>
</body>

</html>
