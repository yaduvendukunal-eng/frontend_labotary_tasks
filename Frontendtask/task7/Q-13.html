<!DOCTYPE html>

<body>
<script>
let num=[12 , -5, 0 ,23 ,-18 , 0, 7 , -2, 15]
let pos=0,neg=0,zero=0;
for (var i of num){
    if (i>0) pos+=i;
    else if (i<0) neg+=i;
    else zero++;
}
console.log("Positive Numbers : "+pos);
console.log("Negative Numbers : "+neg);
console.log("Zeros :"+zero);
</script>
</body>
