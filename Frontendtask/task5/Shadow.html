!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            box-shadow: 10px 10px 5px 0px grey;
        }
        .text{
            text-shadow:2px 2px 0px grey;
        }
    </style>
</head>
<body>
    <h1>Shadow Properties</h1>
    <h2>Box Shadow</h2>
    <div class ="box"></div>
    <h2>Text Shadow</h2>
    <div class ="text">This is some text with a shadow.</div>
    
</body>
</html>
