<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div-block{
            border: 2px solid blue;
            background-color: skyblue;
            width: 200px;
            height: 100px;
            color: white;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h2>Block Display</h2>
    <div class="div-block">
        <h2>Hii</h2>
        <h3>Hello</h3>
        <h3>welcome</h3>
    </div>
    <h1>Inline Display</h1>
    <div class="div-block"></div>
    
</body>
</html>
