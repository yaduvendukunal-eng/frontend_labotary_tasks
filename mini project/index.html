<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <h2>StudyHub</h2>
    <div>
      <a href="#courses">Courses</a>
      <a href="#myCourses">My Courses</a>
    </div>
  </nav>
  <section class="hero">
    <h1>Learn Programming Easily</h1>
    <p>Learn Python, Java and C++ for free!</p>
  </section>
  <section id="courses">
    <h2>Our Courses</h2>
    <input type="text" id="search" placeholder="Search courses..." aria-label="Search courses">
    <div class="course-container" id="courseContainer">
      <div class="course-card">
        <img src="https://placehold.co/400x250/3776AB/FFFFFF?text=Python" alt="Python course">
        <h3>Python</h3>
        <p>Learn Python from basics</p>
        <button onclick="enroll('Python')">Enroll Now</button>
      </div>
      <div class="course-card">
        <img src="https://placehold.co/400x250/EA6D25/FFFFFF?text=Java" alt="Java course">
        <h3>Java</h3>
        <p>Learn Java from basics</p>
        <button onclick="enroll('Java')">Enroll Now</button>
      </div>
      <div class="course-card">
        <img src="https://placehold.co/400x250/00599C/FFFFFF?text=C%2B%2B" alt="C++ course">
        <h3>C++</h3>
        <p>Learn C++ from basics</p>
        <button onclick="enroll('C++')">Enroll Now</button>
      </div>
    </div>
  </section>
  <section id="myCourses">
    <h2>My Courses</h2>
    <div class="course-container" id="enrolledContainer"></div>
  </section>
  <footer><p>© 2026 StudyHub</p></footer>
  <script src="script.js"></script>
</body>
</html>
