<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gamers Pie Chart</title>
  <style>
    body {
      margin: 50px 0 0;
    }

    .pie-chart {
      position: relative;
      width: 440px;
      height: 440px;
      margin: 0 auto;
      border-radius: 50%;
      border: 8px solid darkorange;
      background: conic-gradient(
        moccasin 0deg 90deg,
        lightpink 90deg 180deg,
        palegreen 180deg 270deg,
        lightskyblue 270deg 360deg
      );
    }

    .pie {
      position: absolute;
      font-size: 19px;
      font-weight: bold;
      color: darkgreen;
    }

    .pie span {
      display: block;
      font-size: 14px;
      color: navy;
    }
    .freefire { top: 20%; right: 15%; }
    .cod      { bottom: 20%; right: 22%; }
    .pubg     { bottom: 20%; left: 20%; }
    .valorant { top: 20%; left: 20%; }
  </style>
</head>
<body>

  <div class="pie-chart">
    <div class="pie freefire">Free Fire <span>12 players</span></div>
    <div class="pie cod">COD <span>14 players</span></div>
    <div class="pie pubg">PUBG <span>42 players</span></div>
    <div class="pie valorant">Valorant <span>22 players</span></div>
  </div>

</body>
</html>
