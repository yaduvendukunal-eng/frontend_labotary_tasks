<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
</head>
<body>
    <h2>Image Gallery</h2>

    <img id="mainImage"
         src="https://picsum.photos/id/10/400/250"
         width="400" height="250">

    <br><br>

    <img class="thumb" src="https://picsum.photos/id/20/100/70" width="100">
    <img class="thumb" src="https://picsum.photos/id/30/100/70" width="100">
    <img class="thumb" src="https://picsum.photos/id/40/100/70" width="100">

    <script>
        let thumbnails = document.querySelectorAll(".thumb");

        thumbnails.forEach(function(img) {
            img.addEventListener("click", function() {
                document.getElementById("mainImage").src = img.src.replace("/100/70", "/400/250");
            });
        });
    </script>
</body>
</html>
